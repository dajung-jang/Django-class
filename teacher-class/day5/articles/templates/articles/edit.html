{% extends "base.html" %}
{% block content %}
    <h1>게시글 수정 페이지</h1>

    {% comment %} 
    articles -> app_name
    article -> views.py에서 context 로 넘겨준 article kye 
    {% endcomment %}
    <form action="{% url "articles:update" article.pk %}" method = "POST">
        {% csrf_token %}
        <div>
            <label for="title">TITLE : </label>
            <input type="text" name="title" id="title" value = {{ article.title }}>
        </div>

        <div>
            <label for="content">CONTENT : </label>
            {% comment %} <input type="text" name = "content" id = "content" value = {{ article.content }}> {% endcomment %}
            <textarea name="content" id="content" cols = "30" rows = "10">{{ article.content }}</textarea>
        </div>

        <input type="submit">
    </form>
    {% comment %} 취소버튼 {% endcomment %}
    <a href="{% url "articles:index" %}">[취소]</a>
{% endblock content %}
